<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notations</title>
<meta name="description" content="Translates chord voicings between piano and fretted instruments.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notations">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- APP:BODY -->
<div id="app" class="roomy">
  <header class="bar">
    <div class="brand">Notations <span class="buildtag" id="buildTag" hidden>Test build</span></div>
    <div class="chips">
      <button class="chip" data-act="instr" data-side="src" aria-label="Choose source instrument"><span id="chipSrc"></span></button>
      <button class="iconbtn" data-act="swap" aria-label="Swap source and target"><svg class="ico" viewBox="0 0 24 24"><path d="M4 8h14m-4-4 4 4-4 4M20 16H6m4-4-4 4 4 4"/></svg></button>
      <button class="chip" data-act="instr" data-side="tgt" aria-label="Choose target instrument"><span id="chipTgt"></span></button>
    </div>
    <div class="bar-right">
      <div class="seg" id="segMode" role="group" aria-label="Detail level">
        <button data-act="mode" data-v="simple"><span>Simple</span></button>
        <button data-act="mode" data-v="detailed"><span>Detailed</span></button>
      </div>
      <button class="iconbtn" data-act="library" aria-label="Library"><svg class="ico" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
      <button class="iconbtn" data-act="settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 12h3m4 0h9M4 17h11m4 0h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <main class="stage">
    <section class="strip active" data-side="src" aria-label="Source">
      <div class="strip-main">
        <div class="strip-row" id="srcRow"></div>
        <div class="strip-body"><div class="scroll" id="srcScroll"></div></div>
      </div>
      <div class="playcol"><button class="play" data-act="play" data-side="src" aria-label="Play source"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></button></div>
    </section>
    <div class="divider only-roomy" id="divider" role="separator" aria-orientation="horizontal" aria-label="Drag to share the height between the strips. Double-tap to even them." tabindex="0"><span></span></div>
    <section class="bridge">
      <div class="bridge-left">
        <div class="seg" id="segPlay" role="group" aria-label="Playback">
          <button data-act="playmode" data-v="block"><span>Block</span></button>
          <button data-act="playmode" data-v="arp"><span>Arpeggio</span></button>
        </div>
      </div>
      <div class="bridge-mid" id="bridgeMid"></div>
      <div class="bridge-right">
        <div class="seg only-compact" id="segView" role="group" aria-label="Strip shown">
          <button data-act="view" data-v="src"><span>Source</span></button>
          <button data-act="view" data-v="tgt"><span>Translation</span></button>
        </div>
        <button class="txtbtn only-roomy" id="saveTest" data-act="savetest">Save as test</button>
      </div>
    </section>
    <section class="strip" data-side="tgt" aria-label="Translation">
      <div class="strip-main"><div class="strip-body" id="tgtBody"></div></div>
      <div class="playcol"><button class="play" data-act="play" data-side="tgt" aria-label="Play translation"><svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg></button></div>
    </section>
  </main>
</div>
<div class="scrim" id="scrim" data-act="closesheet"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <button class="iconbtn" id="sheetBack" data-act="backsheet" aria-label="Back" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="sheetTitle"></h2>
    <button class="iconbtn" data-act="closesheet" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>
<!-- /APP:BODY -->
<!-- APP:SCRIPTS -->
<script src="js/engine.js"></script>
<script src="js/util.js"></script>
<script src="js/engine-client.js"></script>
<script src="js/storage.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
<script src="js/sheets.js"></script>
<script src="js/staff.js"></script>
<script src="js/space.js"></script>
<script src="js/boot.js"></script>
<!-- /APP:SCRIPTS -->
</body>
</html>
